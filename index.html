<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curefoods Calling</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#6b7280; --line:#e5e7eb; --accent:#0f766e; --accent-soft:#e6f4f2; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; margin:0; }
  header .crumb { color:var(--muted); cursor:pointer; }
  header .crumb:hover { color:var(--accent); }
  header .me { margin-left:auto; color:var(--muted); font-size:12px; }
  @media (max-width:480px){ header .me .em { display:none; } }
  main { max-width:1180px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 12px; font-size:15px; }
  .muted { color:var(--muted); font-size:12px; }
  .brands { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:640px) { .brands { grid-template-columns:repeat(2,1fr); } }
  .brand { cursor:pointer; transition:border-color .15s; }
  .brand:hover { border-color:var(--accent); }
  .brand { display:flex; flex-direction:column; align-items:center; gap:12px; padding:22px 16px 16px; }
  .brand .logo { width:auto; height:auto; max-width:85%; max-height:96px; border:0; border-radius:0; }
  .brand .logo.badge { width:96px; height:96px; border-radius:16px; font-size:22px; }
  .brand.paused .logo { filter:grayscale(1); opacity:.5; }
  .logo { width:52px; height:52px; border-radius:12px; object-fit:contain; background:#fff; border:1px solid var(--line); flex:none; }
  .logo.badge { display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:var(--accent); background:var(--accent-soft); border:0; }
  .logo.sm { width:auto; max-width:64px; height:24px; border:0; border-radius:0; font-size:10px; display:inline-flex; vertical-align:middle; }
  .pill { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; background:var(--accent-soft); color:var(--accent); }
  .pill.off { background:#f3f4f6; color:var(--muted); }
  nav.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap; }
  nav.tabs button { border:0; background:none; padding:10px 14px; font-size:14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
  nav.tabs button.on { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .kpi .v { font-size:24px; font-weight:650; }
  .kpi .l { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px){ .two { grid-template-columns:1fr; } }
  button.btn { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px; }
  button.btn:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary:disabled { opacity:.5; cursor:default; }
  input[type=text], input[type=search], input[type=date], input[type=email], select { border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .chip { border:1px solid var(--line); border-radius:20px; padding:4px 11px; cursor:pointer; font-size:12px; background:var(--card); }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .store { display:flex; align-items:center; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--line); }
  .store .city { color:var(--muted); font-size:12px; margin-left:6px; }
  .toggle { position:relative; width:38px; height:22px; flex:none; }
  .toggle input { display:none; }
  .toggle span { position:absolute; inset:0; background:#d1d5db; border-radius:22px; cursor:pointer; transition:.15s; }
  .toggle span:before { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .toggle input:checked + span { background:var(--accent); }
  .toggle input:checked + span:before { transform:translateX(16px); }
  .stores { max-height:520px; overflow:auto; display:grid; grid-template-columns:1fr 1fr; column-gap:24px; align-content:start; }
  @media (max-width:800px){ .stores { grid-template-columns:1fr; } }
  .grid { border-collapse:separate; border-spacing:4px; user-select:none; }
  .grid th { text-align:center; border:0; }
  .grid th.slot { text-align:left; white-space:nowrap; }
  .grid td { width:90px; height:40px; border-radius:6px; text-align:center; font-size:11px; cursor:pointer; border:1px solid rgba(0,0,0,.06); touch-action:none; }
  .clip { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .swatch { width:14px; height:14px; border-radius:4px; flex:none; }
  .clip .nm { font-weight:600; min-width:200px; }
  audio { height:32px; }
  .bars { display:flex; align-items:flex-end; gap:6px; overflow-x:auto; height:170px; padding-top:10px; }
  .bar { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; font-size:10px; color:var(--muted); }
  .bar .b { width:100%; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; position:relative; }
  .bar .b .h { position:absolute; bottom:0; left:0; right:0; background:#0b4f49; border-radius:0; }
  .bar .val { color:var(--ink); font-size:11px; margin-bottom:2px; }
  @media (max-width:480px){ .bars { gap:3px; } .bar, .bar .val { font-size:8px; } }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; display:none; z-index:20; width:max-content; max-width:calc(100vw - 32px); }
  .err { color:var(--bad); }
  .loading { color:var(--muted); padding:30px; text-align:center; }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--muted); margin-top:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
</style>
</head>
<body>
<header>
  <h1 class="crumb" data-act="home">Curefoods Calling</h1>
  <span id="crumb2"></span>
  <span class="me" id="me"></span>
</header>
<main id="app"><div class="loading">Loading…</div></main>
<div class="toast" id="toast"></div>

<script>
const S = { home:null, homeP:null, brand:null, tab:null, stores:null, storeById:{}, storeChanges:{}, voice:null, grid:{}, gridDirty:false, paint:'', cityFilter:'All', subFilter:null, q:'',
  seq:0, ov:{}, mut:{}, summary:null, sumP:null, sumAt:0, lastHash:'' };
// Brand logos (logos/<key>.png); brands without one get an initials badge.
const LOGOS = ['kk', 'sb', 'ar', 'me', 'mcrc', 'roz', 'nomad', 'olio', 'cz', 'eatfit'];
const INITIALS = {};
// Home grid order; brands not listed (future ones) go after, in sheet order.
const BRAND_ORDER = ['kk', 'olio', 'sb', 'cz', 'nomad', 'eatfit', 'ar', 'me', 'mcrc', 'roz'];
const brandRank = k => { const i = BRAND_ORDER.indexOf(k); return i === -1 ? BRAND_ORDER.length : i; };
function logoHtml(key, name, small) {
  const cls = 'logo' + (small ? ' sm' : '');
  if (LOGOS.indexOf(key) !== -1) return '<img class="' + cls + '" src="logos/' + key + '.png" alt="' + esc(name) + '" title="' + esc(name) + '">';
  const t = INITIALS[key] || String(name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase();
  return '<span class="' + cls + ' badge">' + esc(t) + '</span>';
}
const COLORS = ['#bfdbfe','#fde68a','#c7d2fe','#fbcfe8','#bbf7d0','#fed7aa','#ddd6fe'];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? Math.round(100*a/b) + '%' : '–';
const IST = 'Asia/Kolkata';
function istParts() {
  const o = {};
  new Intl.DateTimeFormat('en-GB', { timeZone: IST, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).forEach(p => { o[p.type] = p.value; });
  return o;
}
const istDate = () => { const p = istParts(); return p.year + '-' + p.month + '-' + p.day; };
const istHour = () => Number(istParts().hour) % 24;

const API = 'https://script.google.com/macros/s/AKfycbzV7hjULy9OSn3UmEkgiNB-c5z4pDtANJtL3zoKBRIMVHfjNo-5fVyyBkhi2X2QkBVT/exec';
const ROLE_KEY = 'cfi_calling_role';
const NO_RETRY = ['apiUploadClip'];
let TOKEN = '';
try { TOKEN = localStorage.getItem('cfi_calling_token') || ''; } catch (e) {}
// One retry on a network error or a server (5xx / unreadable) reply.
async function post(body, retry) {
  let r, j;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); }
  catch (e) { if (retry) return post(body, false); throw new Error('Could not reach the server. Check your internet connection and try again.'); }
  if (!r.ok) { if (retry && r.status >= 500) return post(body, false); throw new Error('The server had a problem (' + r.status + '). Try again in a minute.'); }
  try { j = await r.json(); } catch (e) { if (retry) return post(body, false); throw new Error('The server sent a reply we could not read. Try again in a minute.'); }
  if (!j.ok) throw new Error(j.error || 'Something went wrong.');
  return j.data;
}
const signedOutErr = () => Object.assign(new Error('Signed out.'), { signedOut: true });
async function call(fn, ...args) {
  if (!TOKEN) { showSignIn(); throw signedOutErr(); }
  try { return await post({ action: 'api', fn: fn, args: args, token: TOKEN }, NO_RETRY.indexOf(fn) === -1); }
  catch (e) {
    if (/sign-in has expired/.test(e.message)) { signOutLocal(); showSignIn('Please sign in again.'); e.signedOut = true; }
    throw e;
  }
}
function raw(fn, ...args) { return post(fn === 'requestCode' ? { action: fn, email: args[0] } : { action: fn, email: args[0], code: args[1] }, false); }
function signOutLocal() {
  try { localStorage.removeItem('cfi_calling_token'); localStorage.removeItem(ROLE_KEY); } catch (e) {}
  TOKEN = ''; S.home = null; S.homeP = null; S.summary = null; S.sumP = null; S.ov = {};
}
async function signOut() {
  if (!leaveOk()) return;
  try { await post({ action: 'signOut', token: TOKEN }, false); } catch (e) {}
  signOutLocal(); history.replaceState(null, '', location.pathname + location.search); showSignIn('Signed out.');
}
// Outside curefoods.in: sign in with an emailed code.
function showSignIn(msg) {
  S.seq++; S.brand = null; S.tab = null;
  $('crumb2').textContent = ''; $('me').textContent = '';
  $('app').innerHTML = '<div class="card" style="max-width:420px;margin:40px auto"><h3>Sign in</h3>' +
    '<p class="muted">' + esc(msg || 'Enter your work email. We\'ll email you a 6-digit code. You stay signed in on this device for 30 days.') + '</p>' +
    '<form class="row" id="fEmail"><input type="email" id="sEmail" placeholder="you@company.com" autocomplete="email" required style="flex:1;min-width:0"><button class="btn primary">Send code</button></form>' +
    '<form class="row" id="fCode" style="margin-top:10px;display:none"><input type="text" id="sCode" placeholder="6-digit code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="flex:1;min-width:0"><button class="btn primary">Sign in</button></form></div>';
  $('fEmail').onsubmit = e => { e.preventDefault(); sendCode(e.target.querySelector('button')); };
  $('fCode').onsubmit = e => { e.preventDefault(); checkCode(e.target.querySelector('button')); };
}
function sendCode(btn) {
  return busy(btn, 'Sending…', async () => { const m = await raw('requestCode', $('sEmail').value); toast(m); $('fCode').style.display = 'flex'; $('sCode').focus(); });
}
function checkCode(btn) {
  return busy(btn, 'Signing in…', async () => {
    TOKEN = await raw('verifyCode', $('sEmail').value, $('sCode').value);
    try { localStorage.setItem('cfi_calling_token', TOKEN); } catch (e) {}
    S.home = null; S.homeP = null; route();
  });
}
function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.style.background = bad ? '#b91c1c' : '#1d2433'; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', bad ? 6000 : 2500);
}
// Disable a button with "Saving…" while an action runs; errors go to a toast.
async function busy(btn, label, fn) {
  if (btn && btn.disabled) return;
  const txt = btn && btn.tagName === 'BUTTON' ? btn.textContent : null;
  if (btn) { btn.disabled = true; if (txt != null) btn.textContent = label || 'Saving…'; }
  try { return await fn(); }
  catch (e) { if (!e.signedOut) toast(e.message, true); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; if (txt != null) btn.textContent = txt; } }
}
// A render is stale once the user moved on (S.seq bumps on every navigation).
function guard() { const q = S.seq, b = S.brand && S.brand.key; return () => q === S.seq && (S.brand && S.brand.key) === b; }
function showErr(box, e, retry) {
  box.innerHTML = '<div class="card"><span class="err">' + esc(e.message || 'Something went wrong.') + '</span> <button class="btn">Retry</button></div>';
  box.querySelector('button').onclick = () => { box.innerHTML = '<div class="loading">Loading…</div>'; retry(); };
}
async function load(boxId, fn) {
  const ok = guard();
  try { await fn(ok); }
  catch (e) { const box = $(boxId); if (ok() && box && !e.signedOut) showErr(box, e, () => load(boxId, fn)); }
}

// ---------- routing: #<brandKey>/<tab>, home = empty hash ----------
const TAB_NAMES = [['overview','Overview'],['stores','Stores'],['voice','Voice & schedule'],['activity','Activity'],['access','Access']];
const tabList = () => TAB_NAMES.filter(t => t[0] !== 'access' || S.home.role === 'owner');
const LEAVE_MSG = 'You have unsaved changes. Leave without saving them?';
const dirty = () => !!(S.brand && (Object.keys(S.storeChanges).length || S.gridDirty));
function discard() { S.storeChanges = {}; S.gridDirty = false; if (S.voice) S.grid = Object.assign({}, S.voice.grid); }
function leaveOk() { if (!dirty()) return true; if (!confirm(LEAVE_MSG)) return false; discard(); return true; }
function nav(h) { if (decodeURIComponent(location.hash.slice(1)) === h) route(); else location.hash = h; }
function goHome() { if (leaveOk()) nav(''); }
function openBrand(key) { if (leaveOk()) nav(key + '/overview'); }
function showTab(tab) { if (S.brand) nav(S.brand.key + '/' + tab); }
function loadHome() {
  if (!S.homeP) {
    const p = S.homeP = call('apiHome').then(h => {
      if (S.homeP === p) { S.home = h; try { localStorage.setItem(ROLE_KEY, h.role); } catch (e) {} }
      return h;
    });
    p.catch(() => { if (S.homeP === p) S.homeP = null; });
  }
  return S.homeP;
}
async function route() {
  const [key, tab] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (!TOKEN) return showSignIn();
  if (S.brand && key !== S.brand.key && dirty()) {
    if (!confirm(LEAVE_MSG)) { history.replaceState(null, '', S.lastHash || location.pathname + location.search); return; }
    discard();
  }
  if (!S.home) {
    const q = ++S.seq;
    $('app').innerHTML = '<div class="loading">Loading…</div>';
    try { await loadHome(); } catch (e) { if (q === S.seq && !e.signedOut) showErr($('app'), e, route); return; }
    if (q !== S.seq || !S.home) return;
  }
  S.lastHash = location.hash;
  $('me').innerHTML = '<span class="em">' + esc(S.home.me) + ' · </span><a href="#" data-act="signout">Sign out</a>';
  if (S.home.role === 'none') {
    S.seq++; S.brand = null; $('crumb2').textContent = '';
    $('app').innerHTML = '<div class="card">You don\'t have access yet. Ask abhilash@curefoods.in to add <b>' + esc(S.home.me) + '</b>.</div>';
    return;
  }
  const b = key ? S.home.brands.find(x => x.key === key) : null;
  if (!b) { if (key) history.replaceState(null, '', location.pathname + location.search); S.lastHash = ''; return renderHome(); }
  const t = tabList().some(x => x[0] === tab) ? tab : 'overview';
  if (t !== tab) { history.replaceState(null, '', '#' + b.key + '/' + t); S.lastHash = location.hash; }
  if (!S.brand || S.brand.key !== b.key) enterBrand(b);
  renderTab(t);
}
function enterBrand(b) {
  S.brand = b; S.stores = null; S.storeById = {}; S.voice = null; S.storeChanges = {}; S.grid = {}; S.gridDirty = false; S.paint = ''; S.showDates = null;
  S.subFilter = null; S.cityFilter = 'All'; S.q = '';
  $('crumb2').innerHTML = '› ' + logoHtml(b.key, b.name, true) + ' ' + esc(b.name);
}
function renderTab(tab) {
  S.seq++; S.tab = tab;
  $('app').innerHTML = '<nav class="tabs">' + tabList().map(t => '<button class="' + (t[0] === tab ? 'on' : '') + '" data-act="tab" data-tab="' + t[0] + '">' + esc(t[1]) + '</button>').join('') + '</nav><div id="tab"><div class="loading">Loading…</div></div>';
  ({ overview:renderOverview, stores:renderStores, voice:renderVoice, activity:renderActivity, access:renderAccess })[tab]();
}

// ---------- home ----------
function renderHome() {
  S.seq++; S.brand = null; S.tab = null; $('crumb2').textContent = '';
  const ordered = S.home.brands.slice().sort((a, b) => brandRank(a.key) - brandRank(b.key));
  $('app').innerHTML = '<div class="brands">' + ordered.map(b =>
    '<div class="card brand' + (b.status === 'Live' ? '' : ' paused') + '" data-act="brand" data-key="' + esc(b.key) + '">' + logoHtml(b.key, b.name) +
    '<span class="pill ' + (b.status === 'Live' ? '' : 'off') + '">' + esc(b.status || 'Not set up') + '</span></div>').join('') + '</div>' +
    (S.home.role === 'owner' ? '<div id="ownerSummary" style="margin-top:24px"><div class="loading">Loading summary…</div></div>' : '');
  if (S.home.role === 'owner') renderOwnerSummary();
}

// Owner-only summary; fetched at most every ~2 minutes, chips re-render from it.
function loadSummary() {
  if (S.sumP && Date.now() - S.sumAt < 120e3) return S.sumP;
  S.sumAt = Date.now();
  const p = S.sumP = call('apiOwnerSummary').then(d => { if (S.sumP === p) S.summary = d; return d; });
  p.catch(() => { if (S.sumP === p) S.sumP = null; });
  return p;
}
async function renderOwnerSummary() {
  const ok = guard(), had = !!S.summary;
  if (had) drawSummary(S.summary);
  try { const d = await loadSummary(); if (ok()) drawSummary(d); }
  catch (e) { const box = $('ownerSummary'); if (ok() && box && !had && !e.signedOut) showErr(box, e, renderOwnerSummary); }
}

// All brands, last full days. Today is partial, so it's shown apart.
function drawSummary(data) {
  const box = $('ownerSummary'); if (!box) return;
  const today = data[0] ? data[0].today : istDate();
  const fullDays = Array.from(new Set([].concat(...data.map(b => b.days.map(d => d.date))))).filter(d => d < today).sort().reverse();
  // Yesterday (full day) or today so far. Default: yesterday before 12 PM IST, today after.
  if (!S.sumMode) S.sumMode = istHour() < 12 ? 'y' : 't';
  const isToday = S.sumMode === 't', isMtd = S.sumMode === 'm';
  let dayList = (isToday ? [today].concat(fullDays) : fullDays).slice(0, 7);
  let cur = [dayList[0]], prev = isToday ? [] : [dayList[1]];
  // MTD: 1st of the month to yesterday (today so far on the 1st), vs the same days last month.
  let mtdLabel = '', prevLabel = '';
  if (isMtd) {
    const ym = today.slice(0, 7), dd = Number(today.slice(8));
    const end = dd > 1 ? dd - 1 : 1;
    const pd = new Date(Date.UTC(Number(ym.slice(0, 4)), Number(ym.slice(5)) - 2, 1));
    const pym = pd.toISOString().slice(0, 7), pLast = new Date(Date.UTC(pd.getUTCFullYear(), pd.getUTCMonth() + 1, 0)).getUTCDate();
    const two = n => String(n).padStart(2, '0');
    cur = []; prev = [];
    for (let i = 1; i <= end; i++) { cur.push(ym + '-' + two(i)); if (i <= pLast) prev.push(pym + '-' + two(i)); }
    dayList = cur.slice().reverse();
    const mon = d => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { month: 'short' });
    mtdLabel = '1–' + end + ' ' + mon(cur[0]) + (dd === 1 ? ' (today so far)' : '');
    prevLabel = '1–' + Math.min(end, pLast) + ' ' + mon(prev[0]);
  }
  const y = cur[0], dby = prev[0];
  const nowLabel = new Date().toLocaleTimeString('en-IN', { timeZone: IST, hour: 'numeric', minute: '2-digit' });
  // Slot filter: a slot uses that slot's numbers from the log; all day uses the day totals.
  const Z = { orders: 0, placed: 0, heard: 0, logged: 0, cost: 0 };
  const get = (b, d) => { const x = b.days.find(v => v.date === d); if (!x) return Z;
    return S.sumSlot ? ((x.slots || {})[S.sumSlot] || Z) : x; };
  // logged = calls in our own log; call rate uses it so calls and orders come from the same source

  const agg = (b, ds) => ds.reduce((a, d) => { const g = get(b, d); return { orders: a.orders + g.orders, placed: a.placed + g.placed, heard: a.heard + g.heard, logged: a.logged + (g.logged == null ? g.placed : g.logged), cost: a.cost + (g.cost || 0), days: a.days + (g.placed > 0 ? 1 : 0) }; }, { orders: 0, placed: 0, heard: 0, logged: 0, cost: 0, days: 0 });
  const sumAll = (ds, f) => data.reduce((a, b) => a + agg(b, ds)[f], 0);
  const fmt = n => n.toLocaleString('en-IN');
  const delta = (a, b) => !b ? '' : '<span style="color:' + (a >= b ? 'var(--accent)' : 'var(--bad)') + '">' + (a >= b ? '▲' : '▼') + ' ' + Math.abs(Math.round(100 * (a - b) / b)) + '%</span>';

  const cmp = (a, b) => isToday ? '' : delta(a, b);
  const spark = b => { const vals = dayList.slice().reverse().map(d => get(b, d).placed); const m = Math.max(1, ...vals);
    return '<span style="display:inline-flex;align-items:flex-end;gap:2px;height:22px">' + vals.map(v => '<i style="display:inline-block;width:' + (vals.length > 10 ? 3 : 7) + 'px;height:' + Math.max(2, Math.round(22 * v / m)) + 'px;background:var(--accent);border-radius:1px"></i>').join('') + '</span>'; };
  const rs = n => '₹' + Math.round(n).toLocaleString('en-IN');
  const perCall = v => v.logged ? '₹' + (v.cost / v.logged).toFixed(2) : '–';
  const row = (name, yv, dv, sp, wk) => '<tr><td>' + name + '</td><td class="n">' + fmt(yv.orders) + '</td><td class="n">' + fmt(yv.placed) + ' ' + cmp(yv.placed, dv.placed) + '</td><td class="n">' + fmt(yv.heard) + '</td><td class="n">' + pct(yv.heard, yv.placed) + '</td><td class="n">' + pct(yv.logged, yv.orders) + '</td><td class="n">' + fmt(wk) + '</td><td>' + sp + '</td><td class="n">' + rs(yv.cost) + '</td><td class="n">' + perCall(yv) + '</td></tr>';
  const nameCell = b => '<span style="display:inline-flex;align-items:center;gap:8px">' + logoHtml(b.key, b.name, true) + esc(b.name) + '</span>';
  const live = data.filter(b => b.days.length || b.error);
  const total = { orders: sumAll(cur, 'orders'), placed: sumAll(cur, 'placed'), heard: sumAll(cur, 'heard'), logged: sumAll(cur, 'logged'), cost: sumAll(cur, 'cost') }, totPrev = { placed: sumAll(prev, 'placed') };
  // Per day averages over days that had calls, so brands that went live mid-month aren't diluted.
  const liveDays = cur.filter(d => sumAll([d], 'placed') > 0).length;
  const wkTotal = dayList.reduce((a, d) => a + sumAll([d], 'placed'), 0);
  const lastCol = (b) => isMtd ? Math.round(agg(b, cur).placed / Math.max(1, agg(b, cur).days)) : dayList.reduce((a, d) => a + get(b, d).placed, 0);

    '<span class="chips" style="margin:0 0 0 auto">' + [['m', 'MTD'], ['y', 'Yesterday'], ['t', 'Today so far']].map(m => '<span class="chip ' + (S.sumMode === m[0] ? 'on' : '') + '" data-act="summode" data-m="' + m[0] + '">' + m[1] + '</span>').join('') + '</span></div>' +
    '<div class="chips" style="margin:0 0 12px">' + [['', 'All day'], ['breakfast', 'Breakfast'], ['lunch', 'Lunch'], ['snacks', 'Snacks'], ['dinner', 'Dinner'], ['late', 'Late night']].map(m => '<span class="chip ' + ((S.sumSlot || '') === m[0] ? 'on' : '') + '" data-act="sumslot" data-s="' + m[0] + '">' + m[1] + '</span>').join('') + '</div>' +
    '<div class="kpis">' +
      '<div class="kpi"><div class="v">' + fmt(total.placed) + '</div><div class="l">Calls made ' + label(y) + (isToday || !totPrev.placed ? '' : ' ' + delta(total.placed, totPrev.placed) + ' vs ' + (isMtd ? prevLabel : label(dby))) + '</div></div>' +
      '<div class="kpi"><div class="v">' + fmt(total.heard) + '</div><div class="l">Heard the full message (' + pct(total.heard, total.placed) + ')</div></div>' +
      '<div class="kpi"><div class="v">' + pct(total.logged, total.orders) + '</div><div class="l">Call rate: orders called ÷ ' + fmt(total.orders) + ' Swiggy + Zomato orders</div></div>' +
      '<div class="kpi"><div class="v">' + rs(total.cost) + '</div><div class="l">Plivo cost · ' + perCall(total) + ' per call</div></div>' +
      (isMtd ? '<div class="kpi"><div class="v">' + fmt(Math.round(total.placed / Math.max(1, liveDays))) + '</div><div class="l">Calls per day on average (days with calls)</div></div>'
      : '<div class="kpi"><div class="v">' + fmt(wkTotal) + '</div><div class="l">Calls in the last ' + dayList.length + (isToday ? ' days (incl. today)' : ' full days') + '</div></div>') +
    '</div>' +
    '<div style="overflow:auto"><table><tr><th>Brand</th><th class="n">Total orders</th><th class="n">Calls done ' + label(y) + '</th><th class="n">Heard calls</th><th class="n">Heard %</th><th class="n">Call rate</th><th class="n">' + (isMtd ? 'Calls per day' : 'Calls last ' + dayList.length + ' days') + '</th><th>Trend</th><th class="n">Cost</th><th class="n">Cost / call</th></tr>' +
      live.map(b => b.error ? '<tr><td>' + nameCell(b) + '</td><td colspan="9" class="err">Couldn\'t read its call log</td></tr>'
        : row(nameCell(b), agg(b, cur), agg(b, prev), spark(b), lastCol(b))).join('') +
      '<tr style="font-weight:600">' + row('All brands', total, totPrev, '', isMtd ? Math.round(total.placed / Math.max(1, liveDays)) : wkTotal).slice(4) +
    '</table></div>' +
    '<p class="muted">' + (isToday ? 'Today is still in progress, so its numbers keep growing until midnight.' : isMtd ? 'Month to date: full days from the 1st to yesterday, compared with the same days last month. Brands that went live this month have no comparison.' : 'Full days only (today is still in progress).') + ' Heard % = calls where the customer listened to the whole message. Call rate = orders we called ÷ Swiggy + Zomato orders (never above 100%). Trend bars = calls per day, oldest to newest. Cost = Plivo billing ($0.00475/min, 30 s blocks; unanswered calls are free) at ₹81/$; cost / call = cost ÷ calls in our log. Slots go by the time the call was made.</p></div>';
}

// ---------- overview ----------

// Go-live / number changes return readiness: update locally, no refetch.
function applyReady(key, r) {
  S.mut['ov_' + key] = Date.now();
  const b = S.home && S.home.brands.find(x => x.key === key);
  if (b) { b.status = r.status; b.plivoNumber = r.plivoNumber; }
  if (S.ov[key]) { S.ov[key].ready = r; if (S.brand && S.brand.key === key) drawOverview(S.ov[key]); }
}
function savePlivo(btn) {
  const key = S.brand.key, num = $('pNum').value;
  return busy(btn, 'Saving…', async () => { const r = await call('apiSetPlivoNumber', key, num); applyReady(key, r); toast('Calling number saved.'); });
}
function setLive(btn, on) {
  if (!confirm(on ? 'Start calling ' + S.brand.name + ' customers now?' : 'Pause all ' + S.brand.name + ' customer calls?')) return;
  const key = S.brand.key;
  return busy(btn, on ? 'Going live…' : 'Pausing…', async () => {
    const r = await call('apiSetLive', key, on); applyReady(key, r);

// ---------- stores ----------
// UrbanPiper lists some stores twice: count each store (by its code/name) once.
const skey = s => String(s.name).split('/').pop().trim().toLowerCase();
const uniq = arr => new Set(arr.map(skey)).size;
const isOn = id => (id in S.storeChanges) ? S.storeChanges[id] : S.storeById[id].active;
const matchQ = s => !S.q || (s.name + ' ' + s.city).toLowerCase().includes(S.q);

function setStores(list) { S.stores = list; S.storeById = {}; list.forEach(s => { S.storeById[s.id] = s; }); }
function renderStores() {
  return load('tab', async ok => {
    if (!S.stores) {
      const key = S.brand.key, t0 = Date.now(), list = await call('apiStores', key);
      if (S.brand && S.brand.key === key && !(S.stores && t0 < (S.mut.stores || 0))) setStores(list);

}

  const shown = S.stores.filter(inFilter);
  const onCount = uniq(S.stores.filter(s => isOn(s.id)));
  const pending = Object.keys(S.storeChanges).length;
  box.innerHTML = '<div class="card">' +
    '<div class="row"><b>' + onCount + ' of ' + uniq(S.stores) + ' stores calling customers</b>' +
      '<input type="search" id="storeQ" placeholder="Search store" value="' + esc(S.q) + '" style="margin-left:auto">' +
      '<button class="btn" data-act="shown" data-on="1">Turn on shown</button><button class="btn" data-act="shown" data-on="0">Turn off shown</button>' +

    (subs.length > 1 ? '<div class="chips"><span class="muted" style="align-self:center">Sub-brand</span>' + ['All'].concat(subs).map(b => '<span class="chip ' + (b === S.subFilter ? 'on' : '') + '" data-act="sub" data-sub="' + esc(b) + '">' + esc(b) +

    '<div class="chips">' + (subs.length > 1 ? '<span class="muted" style="align-self:center">City</span>' : '') + cities.map(c => '<span class="chip ' + (c === S.cityFilter ? 'on' : '') + '" data-act="city" data-city="' + esc(c) + '">' + esc(c) +
      (c === 'All' ? '' : ' ' + uniq(S.stores.filter(s => s.city === c && isOn(s.id))) + '/' + uniq(S.stores.filter(s => s.city === c))) + '</span>').join('') + '</div>' +
    '<div class="stores">' + shown.map(s => '<div class="store" data-id="' + esc(s.id) + '"' + (matchQ(s) ? '' : ' style="display:none"') + '><div>' + esc(s.name) + '<span class="city">' + esc(s.city) + (subs.length > 1 ? ' · ' + esc(s.sub) : '') + '</span></div>' +

// Search only hides/shows rows, so the input keeps focus and nothing re-renders.
function filterStores(q) {
  S.q = q.toLowerCase();
  document.querySelectorAll('#tab .store').forEach(el => { const s = S.storeById[el.dataset.id]; el.style.display = s && matchQ(s) ? '' : 'none'; });
}
function flip(id, on) {
  if (!S.storeById[id]) return;
  if (on === S.storeById[id].active) delete S.storeChanges[id]; else S.storeChanges[id] = on;
  drawStores(true);
}
function setShown(on) {
  S.stores.filter(s => inFilter(s) && matchQ(s)).forEach(s => { if (on === s.active) delete S.storeChanges[s.id]; else S.storeChanges[s.id] = on; });

function saveStores(btn) {
  const key = S.brand.key, sent = Object.assign({}, S.storeChanges);
  const changes = Object.keys(sent).map(id => ({ id: id, active: sent[id] }));
  return busy(btn, 'Saving…', async () => {
    const list = await call('apiSaveStores', key, changes);
    if (!S.brand || S.brand.key !== key) return;

    // Keep only toggles made while this save was in flight.
    Object.keys(S.storeChanges).forEach(id => { const s = S.storeById[id]; if (!s || S.storeChanges[id] === sent[id] || s.active === S.storeChanges[id]) delete S.storeChanges[id]; });
    toast('Saved. Live within 5 minutes.'); drawStores(true);
  });
}

// ---------- voice & schedule ----------
function renderVoice(fresh) {

  if (!S.gridDirty) { S.grid = Object.assign({}, v.grid); return; }
  Object.keys(S.grid).forEach(k => { const x = S.grid[k]; if (x && x !== 'OFF' && !ids.has(x)) S.grid[k] = ''; });

          (c.isDefault ? ' <span class="pill" style="background:#eef2ff;color:#3730a3">Main clip</span>' : '') + ' ' + status(c) + '</span>' +
        '<audio controls preload="none" src="' + esc(c.url) + '"></audio>' +
        (c.isDefault ? '' : '<button class="btn" data-act="makedefault" data-id="' + esc(c.id) + '">Make main clip</button><button class="btn" data-act="removeclip" data-id="' + esc(c.id) + '">Remove</button>') +
        ((c.startDate || c.endDate || S.showDates === c.id)
          ? '<span class="muted">Only between</span><input type="date" value="' + esc(c.startDate) + '" data-chg="dates" data-id="' + esc(c.id) + '"><span class="muted">and</span><input type="date" value="' + esc(c.endDate) + '" data-chg="dates" data-id="' + esc(c.id) + '">'
          : (c.isDefault ? '' : '<button class="btn" data-act="showdates" data-id="' + esc(c.id) + '">Limit to dates</button>')) +
        '<span class="muted">' + esc(c.uploadedBy ? 'Added by ' + c.uploadedBy + ', ' + c.uploadedAt : '') + '</span></div>').join('') +
      '<p class="muted">The <b>main clip</b> plays in every slot unless you paint another clip there in the schedule below.' + (offSlots ? ' Calling is off in ' + offSlots + ' slots.' : '') + '</p>' +
      '<div class="row" style="margin-top:10px"><b>Add a clip:</b><input type="file" id="file" accept="audio/*,.opus,.ogg,.m4a,.mp3,.wav"><input type="text" id="clipName" placeholder="Clip name, e.g. Diwali special"><button class="btn primary" id="upBtn" disabled data-act="upload">Upload</button></div>' +
      '<div id="prep" class="muted" style="margin-top:6px">Any audio file works, including WhatsApp voice notes. It is converted to phone quality before upload. A new clip is not used until you make it the main clip or paint it into the schedule.</div>' +
    '</div>' +
    '<div class="card"><h3>Weekly schedule</h3>' +
      '<div class="muted" style="margin-bottom:6px">This week pattern repeats every week. Pick a brush, then click or drag over slots. Each slot plays exactly one clip, or no calls at all.</div>' +
      v.clips.filter(c => c.startDate || c.endDate).map(c => '<div class="muted">📅 <b>' + esc(c.name) + '</b> only plays from ' + esc(c.startDate || 'now') + ' to ' + esc(c.endDate || 'no end date') + '. Outside those dates its slots play the main clip.</div>').join('') +
      '<div class="chips" id="brushes">' + palette.map(p => '<span class="chip ' + (S.paint === p.id ? 'on' : '') + '" data-act="brush" data-id="' + esc(p.id) + '"><span class="swatch" style="display:inline-block;vertical-align:-2px;margin-right:5px;background:' +
        (p.id === 'OFF' ? '#f3f4f6' : p.id ? color(p.id) : (def ? color(def.id) : '#eee')) + '"></span>' + esc(p.name) + '</span>').join('') + '</div>' +
      '<div style="overflow:auto"><table class="grid" id="grid"><tr><th></th>' + S.home.days.map(d => '<th>' + esc(d) + '</th>').join('') + '</tr>' +
        S.home.slots.map(s => '<tr><th class="slot">' + esc(s.label) + '<div class="muted">' + esc(s.hours) + '</div></th>' + S.home.days.map(d => cell(d, s.key)).join('') + '</tr>').join('') + '</table></div>' +
      '<div class="row" style="margin-top:10px"><button class="btn primary" id="saveGrid" ' + (S.gridDirty ? '' : 'disabled') + ' data-act="savegrid">Save schedule</button>' +
        '<button class="btn" data-act="undo">Undo changes</button></div>' +
    '</div>';
  wireGrid();
}
// Pointer events (mouse + touch); only painted cells and the save button change,
// so a clip that is playing keeps playing.
function wireGrid() {
  const g = $('grid'); if (!g) return;
  let down = false;
  const paint = td => {
    if (!td || !td.dataset.k || !g.contains(td)) return;
    const k = td.dataset.k;
    if ((S.grid[k] || '') !== S.paint) { S.grid[k] = S.paint; S.gridDirty = true; }
    const i = cellInfo(k); td.style.background = i.bg; td.style.color = i.color; td.textContent = i.text;
    const b = $('saveGrid'); if (b) b.disabled = !S.gridDirty;
  };
  g.onpointerdown = e => { const td = e.target.closest('td'); if (!td) return; down = true; paint(td); e.preventDefault(); };
  g.onpointermove = e => { if (!down) return; const el = document.elementFromPoint(e.clientX, e.clientY); paint(el && el.closest('td')); };
  document.onpointerup = document.onpointercancel = () => { down = false; };
}
function pickBrush(el) {
  S.paint = el.dataset.id;
  el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el));
}
function saveGrid(btn) {
  const key = S.brand.key, sent = Object.assign({}, S.grid);
  return busy(btn, 'Saving…', async () => {
    const v = await call('apiSaveSchedule', key, sent);
    if (!S.brand || S.brand.key !== key) return;
    S.gridDirty = JSON.stringify(S.grid) !== JSON.stringify(sent);
    setVoice(v); toast('Schedule saved. Live within 5 minutes.'); drawVoice();
  });
}
function updateClip(btn, label, patch, msg) {
  const key = S.brand.key;
  return busy(btn, label, async () => {
    const v = await call('apiUpdateClip', key, btn.dataset.id, patch);
    if (!S.brand || S.brand.key !== key) return;
    setVoice(v); drawVoice(); toast(msg);
  });
}
function makeDefault(btn) { return updateClip(btn, 'Saving…', { makeDefault: true }, 'Main clip changed. Live within 5 minutes.'); }
function removeClip(btn) {
  if (!confirm('Remove this clip? Any slots it had go back to the main clip.')) return;
  return updateClip(btn, 'Removing…', { archive: true }, 'Clip removed.');
}
function clipDates(el) {
  const c = S.voice.clips.find(x => x.id === el.dataset.id); if (!c) return;
  const ins = el.closest('.clip').querySelectorAll('input[type=date]'), start = ins[0].value, end = ins[1].value;
  if (start && end && end < start) { toast('The end date is before the start date.', true); el.value = el === ins[0] ? c.startDate : c.endDate; return; }
  return updateClip(el, null, { startDate: start, endDate: end }, 'Dates saved.');
}

// Decode any audio the browser can play, mix to mono, resample to 8 kHz,
// level it, and encode a 16-bit WAV (what phone calls use).
let PREPPED = null;
async function prepClip() {
  const f = $('file').files[0]; PREPPED = null; $('upBtn').disabled = true;
  if (!f) return;
  $('prep').textContent = 'Converting…';
  try {
    const buf = await f.arrayBuffer();
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = await ctx.decodeAudioData(buf);
    if (src.duration > 90) throw new Error('Clip is ' + Math.round(src.duration) + 's. Keep it under 90 seconds.');
    const off = new OfflineAudioContext(1, Math.ceil(src.duration * 8000), 8000);
    const node = off.createBufferSource(); node.buffer = src;
    const hp = off.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 120;
    const lp = off.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3600;
    node.connect(hp); hp.connect(lp); lp.connect(off.destination); node.start();
    const out = (await off.startRendering()).getChannelData(0);
    let peak = 0; for (const x of out) peak = Math.max(peak, Math.abs(x));
    const g = peak ? 0.89 / peak : 1;
    const wav = new DataView(new ArrayBuffer(44 + out.length * 2));
    const w = (o, s) => { for (let i = 0; i < s.length; i++) wav.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); wav.setUint32(4, 36 + out.length * 2, true); w(8, 'WAVEfmt '); wav.setUint32(16, 16, true); wav.setUint16(20, 1, true);
    wav.setUint16(22, 1, true); wav.setUint32(24, 8000, true); wav.setUint32(28, 16000, true); wav.setUint16(32, 2, true); wav.setUint16(34, 16, true);
    w(36, 'data'); wav.setUint32(40, out.length * 2, true);
    for (let i = 0; i < out.length; i++) wav.setInt16(44 + i * 2, Math.max(-1, Math.min(1, out[i] * g)) * 32767, true);
    const blob = new Blob([wav], { type: 'audio/wav' });
    const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
    if (!$('prep') || $('file').files[0] !== f) return;
    PREPPED = data;
    $('prep').innerHTML = 'Ready: ' + src.duration.toFixed(1) + ' s at phone quality. Listen before uploading: <audio controls src="' + URL.createObjectURL(blob) + '"></audio>';
    if (!$('clipName').value) $('clipName').value = f.name.replace(/\.[^.]+$/, '').slice(0, 40);
    $('upBtn').disabled = false;
  } catch (e) { const p = $('prep'); if (p) p.innerHTML = '<span class="err">' + esc(e.message || 'This file could not be read.') + '</span>'; }
}
async function uploadClip(btn) {
  if (!PREPPED || btn.disabled) return;
  const key = S.brand.key, name = $('clipName').value, data = PREPPED;
  btn.disabled = true; btn.textContent = 'Uploading…'; $('prep').textContent = 'Uploading…';
  let done = false;
  try {
    const v = await call('apiUploadClip', key, name, data, '', '');
    done = true; if (PREPPED === data) PREPPED = null;
    toast('Clip uploaded. Paint it onto the schedule to use it.');
    if (S.brand && S.brand.key === key) { setVoice(v); drawVoice(); }
  } catch (e) {
    const p = $('prep'); if (p && !e.signedOut) p.innerHTML = '<span class="err">' + esc(e.message) + '</span>';
  } finally { if (!done && btn.isConnected) { btn.disabled = false; btn.textContent = 'Upload'; } }
}

// ---------- activity ----------
function renderActivity() {
  return load('tab', async ok => {
    const a = await call('apiAudit', S.brand.key);
    if (!ok()) return;
    $('tab').innerHTML = '<div class="card"><h3>Recent changes</h3>' + tbl(['When','Who','What','Detail'], a.map(r => [esc(r.time), esc(r.email), esc(r.action), esc(r.detail)])) + '</div>';
  });
}

// ---------- access ----------
function renderAccess() {
  return load('tab', async ok => {
    const list = await call('apiAdmins');
    if (!ok()) return;
    const brandName = k => k === '*' ? 'All brands' : ((S.home.brands.find(b => b.key === k) || {}).name || k);
    $('tab').innerHTML = '<div class="card"><h3>Who can use this dashboard</h3>' +
      '<p class="muted">You see every brand. A brand manager sees only the brands ticked for them. Everyone signs in at this same link with a code sent to their email, and stays signed in for 30 days on each device. Removing someone here signs them out everywhere.</p>' +
      tbl(['Email','Brands',''], list.map(r => [esc(r.email), esc(String(r.brands).split(',').map(x => brandName(x.trim())).join(', ')), '<button class="btn" data-act="deladmin" data-email="' + esc(r.email) + '">Remove</button>'])) +
      '<div style="margin-top:14px"><b>Add or update a person</b></div>' +
      '<div class="row" style="margin-top:8px"><input type="text" id="aEmail" placeholder="email (or paste Name &lt;email&gt;)" style="flex:1;min-width:0;max-width:420px"></div>' +
      '<div class="chips" id="aBrands">' + S.home.brands.map(b => '<label class="chip"><input type="checkbox" value="' + esc(b.key) + '"' + (b.key === S.brand.key ? ' checked' : '') + '> ' + esc(b.name) + '</label>').join('') + '</div>' +
      '<button class="btn primary" data-act="addadmin">Give access</button></div>';
  });
}
function addAdmin(btn) {
  const brands = Array.from(document.querySelectorAll('#aBrands input:checked')).map(i => i.value).join(',');
  const email = $('aEmail').value;
  return busy(btn, 'Saving…', async () => { await call('apiSaveAdmin', email, brands, false); toast('Access saved. They can open the same dashboard link.'); renderAccess(); });
}
function delAdmin(btn) {
  const e = btn.dataset.email;
  if (!confirm('Remove ' + e + '?')) return;
  return busy(btn, 'Removing…', async () => { await call('apiSaveAdmin', e, '', true); renderAccess(); });
}

// ---------- events ----------
const ACT = {
  home: () => goHome(), signout: () => signOut(),
  brand: el => openBrand(el.dataset.key), tab: el => showTab(el.dataset.tab),
  summode: el => { S.sumMode = el.dataset.m; if (S.summary) drawSummary(S.summary); },
  sumslot: el => { S.sumSlot = el.dataset.s; if (S.summary) drawSummary(S.summary); },
  setlive: el => setLive(el, el.dataset.on === '1'), plivo: el => savePlivo(el),
  shown: el => setShown(el.dataset.on === '1'), savestores: el => saveStores(el),
  sub: el => { S.subFilter = el.dataset.sub; drawStores(); }, city: el => { S.cityFilter = el.dataset.city; drawStores(); },
  brush: el => pickBrush(el), makedefault: el => makeDefault(el), removeclip: el => removeClip(el),
  showdates: el => { S.showDates = el.dataset.id; drawVoice(); },
  upload: el => uploadClip(el), savegrid: el => saveGrid(el), undo: () => renderVoice(true),
  addadmin: el => addAdmin(el), deladmin: el => delAdmin(el)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  if (el.tagName === 'A') e.preventDefault();
  ACT[el.dataset.act](el);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.store != null) flip(t.dataset.store, t.checked);
  else if (t.dataset.chg === 'dates') clipDates(t);
  else if (t.id === 'file') prepClip();
});
document.addEventListener('input', e => { if (e.target.id === 'storeQ') filterStores(e.target.value); });
window.addEventListener('beforeunload', e => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', route);

// Owners: fetch the summary alongside apiHome instead of after it.
try { if (TOKEN && localStorage.getItem(ROLE_KEY) === 'owner') loadSummary(); } catch (e) {}
route();
</script>
