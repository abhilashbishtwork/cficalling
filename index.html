<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curefoods Calling</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#6b7280; --line:#e5e7eb; --accent:#0f766e; --accent-soft:#e6f4f2; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; margin:0; }
  header .crumb { color:var(--muted); cursor:pointer; }
  header .crumb:hover { color:var(--accent); }
  header .me { margin-left:auto; color:var(--muted); font-size:12px; }
  main { max-width:1180px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 12px; font-size:15px; }
  .muted { color:var(--muted); font-size:12px; }
  .brands { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .brand { cursor:pointer; transition:border-color .15s; }
  .brand:hover { border-color:var(--accent); }
  .brand .name { font-size:17px; font-weight:600; margin-bottom:4px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; background:var(--accent-soft); color:var(--accent); }
  .pill.off { background:#f3f4f6; color:var(--muted); }
  nav.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap; }
  nav.tabs button { border:0; background:none; padding:10px 14px; font-size:14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
  nav.tabs button.on { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .kpi .v { font-size:24px; font-weight:650; }
  .kpi .l { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px){ .two { grid-template-columns:1fr; } }
  button.btn { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px; }
  button.btn:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary:disabled { opacity:.5; cursor:default; }
  input[type=text], input[type=search], input[type=date], input[type=email], select { border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .chip { border:1px solid var(--line); border-radius:20px; padding:4px 11px; cursor:pointer; font-size:12px; background:var(--card); }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .store { display:flex; align-items:center; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--line); }
  .store .city { color:var(--muted); font-size:12px; margin-left:6px; }
  .toggle { position:relative; width:38px; height:22px; flex:none; }
  .toggle input { display:none; }
  .toggle span { position:absolute; inset:0; background:#d1d5db; border-radius:22px; cursor:pointer; transition:.15s; }
  .toggle span:before { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .toggle input:checked + span { background:var(--accent); }
  .toggle input:checked + span:before { transform:translateX(16px); }
  .stores { max-height:520px; overflow:auto; columns:2; column-gap:24px; }
  @media (max-width:800px){ .stores { columns:1; } }
  .store { break-inside:avoid; }
  .grid { border-collapse:separate; border-spacing:4px; user-select:none; }
  .grid th { text-align:center; border:0; }
  .grid th.slot { text-align:left; white-space:nowrap; }
  .grid td { width:90px; height:40px; border-radius:6px; text-align:center; font-size:11px; cursor:pointer; border:1px solid rgba(0,0,0,.06); }
  .clip { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .swatch { width:14px; height:14px; border-radius:4px; flex:none; }
  .clip .nm { font-weight:600; min-width:200px; }
  audio { height:32px; }
  .bars { display:flex; align-items:flex-end; gap:6px; height:170px; padding-top:10px; }
  .bar { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; font-size:10px; color:var(--muted); }
  .bar .b { width:100%; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; position:relative; }
  .bar .b .h { position:absolute; bottom:0; left:0; right:0; background:#0b4f49; border-radius:0; }
  .bar .val { color:var(--ink); font-size:11px; margin-bottom:2px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; display:none; z-index:20; }
  .err { color:var(--bad); }
  .loading { color:var(--muted); padding:30px; text-align:center; }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--muted); margin-top:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
</style>
</head>
<body>
<header>
  <h1 class="crumb" onclick="goHome()">Curefoods Calling</h1>
  <span id="crumb2"></span>
  <span class="me" id="me"></span>
</header>
<main id="app"><div class="loading">Loading…</div></main>
<div class="toast" id="toast"></div>

<script>
const S = { home:null, brand:null, tab:'overview', stores:null, storeChanges:{}, voice:null, grid:{}, paint:'', cityFilter:'All' };
const COLORS = ['#bfdbfe','#fde68a','#c7d2fe','#fbcfe8','#bbf7d0','#fed7aa','#ddd6fe'];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? Math.round(100*a/b) + '%' : '–';

const API = 'https://script.google.com/macros/s/AKfycbzV7hjULy9OSn3UmEkgiNB-c5z4pDtANJtL3zoKBRIMVHfjNo-5fVyyBkhi2X2QkBVT/exec';
let TOKEN = '';
try { TOKEN = localStorage.getItem('cfi_calling_token') || ''; } catch (e) {}
async function post(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Something went wrong.');
  return j.data;
}
async function call(fn, ...args) {
  if (!TOKEN) { showSignIn(); throw new Error('signed out'); }
  try { return await post({ action: 'api', fn: fn, args: args, token: TOKEN }); }
  catch (e) {
    if (/sign-in has expired/.test(e.message)) { signOutLocal(); showSignIn('Please sign in again.'); }
    else toast(e.message, true);
    throw e;
  }
}
async function raw(fn, ...args) {
  try { return await post(fn === 'requestCode' ? { action: fn, email: args[0] } : { action: fn, email: args[0], code: args[1] }); }
  catch (e) { toast(e.message, true); throw e; }
}
function signOutLocal() { try { localStorage.removeItem('cfi_calling_token'); } catch (e) {} TOKEN = ''; S.home = null; }
async function signOut() { try { await post({ action: 'signOut', token: TOKEN }); } catch (e) {} signOutLocal(); showSignIn('Signed out.'); }
// Outside curefoods.in: sign in with an emailed code.
function showSignIn(msg) {
  $('crumb2').textContent = ''; $('me').textContent = '';
  $('app').innerHTML = '<div class="card" style="max-width:420px;margin:40px auto"><h3>Sign in</h3>' +
    '<p class="muted">' + (msg || 'Enter your work email. We\'ll email you a 6-digit code. You stay signed in on this device for 30 days.') + '</p>' +
    '<div class="row"><input type="email" id="sEmail" placeholder="you@company.com" style="flex:1"><button class="btn primary" onclick="sendCode()">Send code</button></div>' +
    '<div class="row" id="codeRow" style="margin-top:10px;display:none"><input type="text" id="sCode" placeholder="6-digit code" inputmode="numeric" style="flex:1"><button class="btn primary" onclick="checkCode()">Sign in</button></div></div>';
}
async function sendCode() { const m = await raw('requestCode', $('sEmail').value); toast(m); $('codeRow').style.display = 'flex'; $('sCode').focus(); }
async function checkCode() {
  TOKEN = await raw('verifyCode', $('sEmail').value, $('sCode').value);
  try { localStorage.setItem('cfi_calling_token', TOKEN); } catch (e) {}
  S.home = null; goHome();
}
function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.style.background = bad ? '#b91c1c' : '#1d2433'; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', bad ? 6000 : 2500);
}

// ---------- home ----------
async function goHome() {
  S.brand = null; $('crumb2').textContent = '';
  if (!TOKEN) return showSignIn();
  if (!S.home) S.home = await call('apiHome');
  $('me').innerHTML = esc(S.home.me) + ' · <a href="#" onclick="signOut();return false">Sign out</a>';
  if (S.home.role === 'none') { $('app').innerHTML = '<div class="card">You don\'t have access yet. Ask abhilash@curefoods.in to add <b>' + esc(S.home.me) + '</b>.</div>'; return; }
  $('app').innerHTML = '<div class="brands">' + S.home.brands.map(b =>
    '<div class="card brand" onclick="openBrand(\'' + b.key + '\')"><div class="name">' + esc(b.name) + '</div>' +
    '<span class="pill ' + (b.status === 'Live' ? '' : 'off') + '">' + esc(b.status || 'Not set up') + '</span></div>').join('') + '</div>';
}

function openBrand(key) {
  S.brand = S.home.brands.find(b => b.key === key);
  S.stores = null; S.voice = null; S.storeChanges = {};
  $('crumb2').innerHTML = '› ' + esc(S.brand.name);
  showTab('overview');
}

function showTab(tab) {
  S.tab = tab;
  const tabs = [['overview','Overview'],['stores','Stores'],['voice','Voice & schedule'],['activity','Activity']];
  if (S.home.role === 'owner') tabs.push(['access','Access']);
  $('app').innerHTML = '<nav class="tabs">' + tabs.map(t => '<button class="' + (t[0] === tab ? 'on' : '') + '" onclick="showTab(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</nav><div id="tab"><div class="loading">Loading…</div></div>';
  ({ overview:renderOverview, stores:renderStores, voice:renderVoice, activity:renderActivity, access:renderAccess })[tab]();
}

// ---------- overview ----------
async function renderOverview() {
  const [o, r] = await Promise.all([call('apiOverview', S.brand.key), call('apiReadiness', S.brand.key)]);
  S.ready = r;
  const today = o.days[0] || { orders:0, placed:0, heard:0, notReached:0, waiting:0 };
  const k = (v,l) => '<div class="kpi"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>';
  const trend = o.days.slice(0, 14).reverse();
  const max = Math.max(1, ...trend.map(d => d.placed));
  const tick = ok => ok ? '<b style="color:var(--accent)">✓</b>' : '<b style="color:var(--bad)">✗</b>';
  const ready = r.plivoNumber && r.mainClip && r.storesOn;
  const statusCard = r.status === 'Live'
    ? '<div class="card row" style="border-color:var(--accent)"><span class="pill">● Live</span><span>Customers of ' + esc(S.brand.name) + ' are being called.</span>' +
        (r.isOwner ? '<button class="btn" style="margin-left:auto" onclick="setLive(false)">Pause calling</button>' : '') + '</div>'
    : '<div class="card" style="border-color:#f59e0b"><h3>' + esc(S.brand.name) + ' is paused: no customer calls yet</h3>' +
        '<div style="line-height:2">' +
        tick(r.plivoNumber) + ' Calling number: ' + (r.plivoNumber ? esc(r.plivoNumber) : 'not set') +
          (r.isOwner ? ' <input type="text" id="pNum" placeholder="Plivo number" value="' + esc(r.plivoNumber) + '" style="width:160px"> <button class="btn" onclick="savePlivo()">Save</button>' : '') + '<br>' +
        tick(r.mainClip) + ' Main voice clip: ' + (r.mainClip ? esc(r.mainClip) : 'not uploaded. Add one in <a href="#" onclick="showTab(\'voice\');return false">Voice &amp; schedule</a>') + '<br>' +
        tick(r.storesOn) + ' Stores on: ' + r.storesOn + ' of ' + r.storesAll + '</div>' +
        (r.isOwner ? '<button class="btn primary" style="margin-top:10px" ' + (ready ? '' : 'disabled') + ' onclick="setLive(true)">Go live</button>' : '') + '</div>';
  $('tab').innerHTML = statusCard +
    '<div class="row muted" style="margin-bottom:10px">Live now: <b style="color:var(--ink)">' + esc(o.live.day + ' ' + o.live.slot + ' · ' + o.live.label) + '</b>' +
      (o.lastCheck ? '&nbsp;·&nbsp; last order check ' + esc(o.lastCheck) : '') + '</div>' +
    '<div class="kpis">' +
      k(today.placed.toLocaleString('en-IN'), 'Calls made today') +
      k(pct(today.placed, today.orders), 'Call rate (calls ÷ orders)') +
      k(pct(today.heard, today.placed), 'Heard the message') +
      k(today.notReached.toLocaleString('en-IN'), 'Not reached (no answer / rejected / busy)') +
      k(today.orders.toLocaleString('en-IN'), 'Swiggy + Zomato orders seen') +
      k('<span class="muted" style="font-size:14px">Not connected yet</span>', 'Ratings from called orders') +
    '</div>' +
    '<div class="card"><h3>Last 14 days</h3>' +
      (trend.length ? '<div class="bars">' + trend.map(d => {
        const h = Math.round(100 * d.placed / max), hh = d.placed ? Math.round(100 * d.heard / d.placed) : 0;
        return '<div class="bar" title="' + d.date + ': ' + d.placed + ' calls, ' + d.heard + ' heard' + (d.plivo != null ? ', Plivo ' + d.plivo : '') + '">' +
          '<div class="val">' + d.placed + '</div><div class="b" style="height:' + h + '%"><div class="h" style="height:' + hh + '%"></div></div>' + d.date.slice(8) + '/' + d.date.slice(5,7) + '</div>';
      }).join('') + '</div><div class="legend"><span><i style="background:#0b4f49"></i>Heard message</span><span><i style="background:var(--accent)"></i>Calls made</span></div>' : '<div class="muted">No calls yet.</div>') +
    '</div>' +
    '<div class="two">' +
      '<div class="card"><h3>Today by city</h3>' + tbl(['City','Orders','Calls','Heard %'], o.cities.map(c => [esc(c.city), c.orders, c.placed, pct(c.heard, c.placed)])) + '</div>' +
      '<div class="card"><h3>Today by store</h3><div style="max-height:420px;overflow:auto">' + tbl(['Store','City','Calls','Heard %'], o.stores.map(s => [esc(s.store), esc(s.city), s.placed, pct(s.heard, s.placed)])) + '</div></div>' +
    '</div>';
}
function tbl(head, rows) {
  if (!rows.length) return '<div class="muted">Nothing yet today.</div>';
  return '<table><tr>' + head.map((h,i) => '<th class="' + (i ? 'n' : '') + '">' + h + '</th>').join('') + '</tr>' +
    rows.map(r => '<tr>' + r.map((v,i) => '<td class="' + (i && typeof v !== 'string' || /%$/.test(v) ? 'n' : '') + '">' + v + '</td>').join('') + '</tr>').join('') + '</table>';
}

async function savePlivo() { await call('apiSetPlivoNumber', S.brand.key, $('pNum').value); toast('Calling number saved.'); renderOverview(); }
async function setLive(on) {
  if (!confirm(on ? 'Start calling ' + S.brand.name + ' customers now?' : 'Pause all ' + S.brand.name + ' customer calls?')) return;
  await call('apiSetLive', S.brand.key, on); toast(on ? 'Live. Calls start within 5 minutes.' : 'Paused. No new calls from the next check.');
  S.home = null; await call('apiHome').then(h => { S.home = h; S.brand = h.brands.find(b => b.key === S.brand.key); }); renderOverview();
}

// ---------- stores ----------
async function renderStores() {
  if (!S.stores) S.stores = await call('apiStores', S.brand.key);
  const cities = ['All', ...Array.from(new Set(S.stores.map(s => s.city))).sort()];
  const active = id => (id in S.storeChanges) ? S.storeChanges[id] : S.stores.find(s => s.id === id).active;
  const shown = S.stores.filter(s => (S.cityFilter === 'All' || s.city === S.cityFilter) &&
    (!S.q || (s.name + ' ' + s.city).toLowerCase().includes(S.q)));
  const onCount = S.stores.filter(s => active(s.id)).length;
  const pending = Object.keys(S.storeChanges).length;
  $('tab').innerHTML = '<div class="card">' +
    '<div class="row"><b>' + onCount + ' of ' + S.stores.length + ' stores calling customers</b>' +
      '<input type="search" placeholder="Search store" value="' + esc(S.q || '') + '" oninput="S.q=this.value.toLowerCase();renderStores()" style="margin-left:auto">' +
      '<button class="btn" onclick="setShown(true)">Turn on shown</button><button class="btn" onclick="setShown(false)">Turn off shown</button>' +
      '<button class="btn primary" ' + (pending ? '' : 'disabled') + ' onclick="saveStores()">Save' + (pending ? ' (' + pending + ')' : '') + '</button></div>' +
    '<div class="chips">' + cities.map(c => '<span class="chip ' + (c === S.cityFilter ? 'on' : '') + '" data-city="' + esc(c) + '" onclick="S.cityFilter=this.dataset.city;renderStores()">' + esc(c) +
      (c === 'All' ? '' : ' ' + S.stores.filter(s => s.city === c && active(s.id)).length + '/' + S.stores.filter(s => s.city === c).length) + '</span>').join('') + '</div>' +
    '<div class="stores">' + shown.map(s => '<div class="store"><div>' + esc(s.name) + '<span class="city">' + esc(s.city) + '</span></div>' +
      '<label class="toggle"><input type="checkbox" ' + (active(s.id) ? 'checked' : '') + ' onchange="flip(\'' + s.id + '\',this.checked)"><span></span></label></div>').join('') + '</div>' +
    '<p class="muted">Changes go live on the next order check (within about 5 minutes).</p></div>';
  const q = document.querySelector('input[type=search]'); if (S.q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
function flip(id, on) {
  const orig = S.stores.find(s => s.id === id).active;
  if (on === orig) delete S.storeChanges[id]; else S.storeChanges[id] = on;
  renderStores();
}
function setShown(on) {
  S.stores.filter(s => (S.cityFilter === 'All' || s.city === S.cityFilter) && (!S.q || (s.name + ' ' + s.city).toLowerCase().includes(S.q)))
    .forEach(s => { if (on === s.active) delete S.storeChanges[s.id]; else S.storeChanges[s.id] = on; });
  renderStores();
}
async function saveStores() {
  const changes = Object.keys(S.storeChanges).map(id => ({ id: id, active: S.storeChanges[id] }));
  S.stores = await call('apiSaveStores', S.brand.key, changes);
  S.storeChanges = {}; toast('Saved. Live within 5 minutes.'); renderStores();
}

// ---------- voice & schedule ----------
async function renderVoice(fresh) {
  if (!S.voice || fresh) { S.voice = await call('apiVoice', S.brand.key); S.grid = Object.assign({}, S.voice.grid); S.gridDirty = false; }
  const v = S.voice;
  const color = id => { const i = v.clips.findIndex(c => c.id === id); return i < 0 ? '#eee' : COLORS[i % COLORS.length]; };
  const def = v.clips.find(c => c.isDefault);
  const cell = (d, s) => {
    const val = S.grid[d + '|' + s] || '';
    if (val === 'OFF') return '<td style="background:#f3f4f6;color:#9ca3af" data-k="' + d + '|' + s + '">Off</td>';
    const id = val || (def && def.id);
    const c = v.clips.find(x => x.id === id);
    return '<td style="background:' + color(id) + '" data-k="' + d + '|' + s + '">' + esc(c ? c.name.slice(0, 16) : '?') + '</td>';
  };
  const palette = [{ id:'', name:'Main clip' + (def ? ': ' + def.name : '') }].concat(v.clips.filter(c => !c.isDefault)).concat([{ id:'OFF', name:'Calling off' }]);
  // How many of the 35 saved slots each clip owns (unpainted slots belong to the main clip).
  const used = {}; let offSlots = 0;
  S.home.days.forEach(d => S.home.slots.forEach(s => { const val = v.grid[d + '|' + s.key] || ''; if (val === 'OFF') offSlots++; else { const id = val || (def && def.id); used[id] = (used[id] || 0) + 1; } }));
  const liveClip = v.clips.find(c => c.name === v.live.label);
  const status = c => {
    if (liveClip && liveClip.id === c.id) return '<span class="pill">▶ Playing now</span>';
    if (used[c.id]) return '<span class="pill off">In ' + used[c.id] + ' of 35 slots</span>';
    return '<span class="pill off">Not in use</span>';
  };
  $('tab').innerHTML =
    '<div class="card" style="border-color:var(--accent)">' +
      '<div class="muted">Customers are hearing right now (' + esc(v.live.day + ' ' + v.live.slot) + ')</div>' +
      (liveClip ? '<div class="row" style="margin-top:6px"><span style="font-size:18px;font-weight:650">' + esc(liveClip.name) + '</span><audio controls preload="none" src="' + esc(liveClip.url) + '"></audio></div>'
                : '<div style="font-size:18px;font-weight:650;margin-top:6px">' + esc(v.live.label) + '</div>') +
    '</div>' +
    '<div class="card"><h3>Voice clips</h3>' +
      v.clips.map(c => '<div class="clip"><span class="swatch" style="background:' + color(c.id) + '"></span><span class="nm">' + esc(c.name) +
          (c.isDefault ? ' <span class="pill" style="background:#eef2ff;color:#3730a3">Main clip</span>' : '') + ' ' + status(c) + '</span>' +
        '<audio controls preload="none" src="' + esc(c.url) + '"></audio>' +
        (c.isDefault ? '' : '<button class="btn" onclick="makeDefault(\'' + c.id + '\')">Make main clip</button><button class="btn" onclick="removeClip(\'' + c.id + '\')">Remove</button>') +
        ((c.startDate || c.endDate || S.showDates === c.id)
          ? '<span class="muted">Only between</span><input type="date" value="' + c.startDate + '" onchange="clipDates(\'' + c.id + '\',this.value,null)"><span class="muted">and</span><input type="date" value="' + c.endDate + '" onchange="clipDates(\'' + c.id + '\',null,this.value)">'
          : (c.isDefault ? '' : '<button class="btn" onclick="S.showDates=\'' + c.id + '\';renderVoice()">Limit to dates</button>')) +
        '<span class="muted">' + esc(c.uploadedBy ? 'Added by ' + c.uploadedBy + ', ' + c.uploadedAt : '') + '</span></div>').join('') +
      '<p class="muted">The <b>main clip</b> plays in every slot unless you paint another clip there in the schedule below.' + (offSlots ? ' Calling is off in ' + offSlots + ' slots.' : '') + '</p>' +
      '<div class="row" style="margin-top:10px"><b>Add a clip:</b><input type="file" id="file" accept="audio/*,.opus,.ogg,.m4a,.mp3,.wav" onchange="prepClip()"><input type="text" id="clipName" placeholder="Clip name, e.g. Diwali special"><button class="btn primary" id="upBtn" disabled onclick="uploadClip()">Upload</button></div>' +
      '<div id="prep" class="muted" style="margin-top:6px">Any audio file works, including WhatsApp voice notes. It is converted to phone quality before upload. A new clip is not used until you make it the main clip or paint it into the schedule.</div>' +
    '</div>' +
    '<div class="card"><h3>Weekly schedule</h3>' +
      '<div class="muted" style="margin-bottom:6px">This week pattern repeats every week. Pick a brush, then click or drag over slots. Each slot plays exactly one clip, or no calls at all.</div>' +
      v.clips.filter(c => c.startDate || c.endDate).map(c => '<div class="muted">📅 <b>' + esc(c.name) + '</b> only plays from ' + esc(c.startDate || 'now') + ' to ' + esc(c.endDate || 'no end date') + '. Outside those dates its slots play the main clip.</div>').join('') +
      '<div class="chips">' + palette.map(p => '<span class="chip ' + (S.paint === p.id ? 'on' : '') + '" onclick="S.paint=\'' + p.id + '\';renderVoice()"><span class="swatch" style="display:inline-block;vertical-align:-2px;margin-right:5px;background:' +
        (p.id === 'OFF' ? '#f3f4f6' : p.id ? color(p.id) : (def ? color(def.id) : '#eee')) + '"></span>' + esc(p.name) + '</span>').join('') + '</div>' +
      '<div style="overflow:auto"><table class="grid" id="grid"><tr><th></th>' + S.home.days.map(d => '<th>' + d + '</th>').join('') + '</tr>' +
        S.home.slots.map(s => '<tr><th class="slot">' + s.label + '<div class="muted">' + s.hours + '</div></th>' + S.home.days.map(d => cell(d, s.key)).join('') + '</tr>').join('') + '</table></div>' +
      '<div class="row" style="margin-top:10px"><button class="btn primary" ' + (S.gridDirty ? '' : 'disabled') + ' onclick="saveGrid()">Save schedule</button>' +
        '<button class="btn" onclick="renderVoice(true)">Undo changes</button></div>' +
    '</div>';
  wireGrid();
}
function wireGrid() {
  const g = $('grid'); if (!g) return;
  let down = false;
  const paint = td => { if (!td || !td.dataset.k) return; S.grid[td.dataset.k] = S.paint; S.gridDirty = true; };
  g.onmousedown = e => { down = true; paint(e.target.closest('td')); e.preventDefault(); };
  g.onmouseover = e => { if (down) { paint(e.target.closest('td')); } };
  document.onmouseup = () => { if (down) { down = false; renderVoice(); } };
}
async function saveGrid() {
  S.voice = await call('apiSaveSchedule', S.brand.key, S.grid);
  S.grid = Object.assign({}, S.voice.grid); S.gridDirty = false;
  toast('Schedule saved. Live within 5 minutes.'); renderVoice();
}
async function makeDefault(id) { S.voice = await call('apiUpdateClip', S.brand.key, id, { makeDefault: true }); S.grid = Object.assign({}, S.voice.grid); renderVoice(); toast('Main clip changed. Live within 5 minutes.'); }
async function removeClip(id) {
  if (!confirm('Remove this clip? Any slots it had go back to the main clip.')) return;
  S.voice = await call('apiUpdateClip', S.brand.key, id, { archive: true }); S.grid = Object.assign({}, S.voice.grid); renderVoice(); toast('Clip removed.');
}
async function clipDates(id, start, end) {
  const c = S.voice.clips.find(x => x.id === id);
  S.voice = await call('apiUpdateClip', S.brand.key, id, { startDate: start != null ? start : c.startDate, endDate: end != null ? end : c.endDate });
  toast('Dates saved.');
}

// Decode any audio the browser can play, mix to mono, resample to 8 kHz,
// level it, and encode a 16-bit WAV (what phone calls use).
let PREPPED = null;
async function prepClip() {
  const f = $('file').files[0]; PREPPED = null; $('upBtn').disabled = true;
  if (!f) return;
  $('prep').textContent = 'Converting…';
  try {
    const buf = await f.arrayBuffer();
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = await ctx.decodeAudioData(buf);
    if (src.duration > 90) throw new Error('Clip is ' + Math.round(src.duration) + 's. Keep it under 90 seconds.');
    const off = new OfflineAudioContext(1, Math.ceil(src.duration * 8000), 8000);
    const node = off.createBufferSource(); node.buffer = src;
    const hp = off.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 120;
    const lp = off.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3600;
    node.connect(hp); hp.connect(lp); lp.connect(off.destination); node.start();
    const out = (await off.startRendering()).getChannelData(0);
    let peak = 0; for (const x of out) peak = Math.max(peak, Math.abs(x));
    const g = peak ? 0.89 / peak : 1;
    const wav = new DataView(new ArrayBuffer(44 + out.length * 2));
    const w = (o, s) => { for (let i = 0; i < s.length; i++) wav.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); wav.setUint32(4, 36 + out.length * 2, true); w(8, 'WAVEfmt '); wav.setUint32(16, 16, true); wav.setUint16(20, 1, true);
    wav.setUint16(22, 1, true); wav.setUint32(24, 8000, true); wav.setUint32(28, 16000, true); wav.setUint16(32, 2, true); wav.setUint16(34, 16, true);
    w(36, 'data'); wav.setUint32(40, out.length * 2, true);
    for (let i = 0; i < out.length; i++) wav.setInt16(44 + i * 2, Math.max(-1, Math.min(1, out[i] * g)) * 32767, true);
    const blob = new Blob([wav], { type: 'audio/wav' });
    PREPPED = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
    $('prep').innerHTML = 'Ready: ' + src.duration.toFixed(1) + ' s at phone quality. Listen before uploading: <audio controls src="' + URL.createObjectURL(blob) + '"></audio>';
    if (!$('clipName').value) $('clipName').value = f.name.replace(/\.[^.]+$/, '').slice(0, 40);
    $('upBtn').disabled = false;
  } catch (e) { $('prep').innerHTML = '<span class="err">' + esc(e.message || 'This file could not be read.') + '</span>'; }
}
async function uploadClip() {
  if (!PREPPED) return;
  $('upBtn').disabled = true; $('prep').textContent = 'Uploading…';
  S.voice = await call('apiUploadClip', S.brand.key, $('clipName').value, PREPPED, '', '');
  S.grid = Object.assign({}, S.voice.grid); PREPPED = null;
  toast('Clip uploaded. Paint it onto the schedule to use it.'); renderVoice();
}

// ---------- activity ----------
async function renderActivity() {
  const a = await call('apiAudit', S.brand.key);
  $('tab').innerHTML = '<div class="card"><h3>Recent changes</h3>' + tbl(['When','Who','What','Detail'], a.map(r => [esc(r.time), esc(r.email), esc(r.action), esc(r.detail)])) + '</div>';
}

// ---------- access ----------
async function renderAccess() {
  const list = await call('apiAdmins');
  const brandName = k => k === '*' ? 'All brands' : ((S.home.brands.find(b => b.key === k) || {}).name || k);
  $('tab').innerHTML = '<div class="card"><h3>Who can use this dashboard</h3>' +
    '<p class="muted">You see every brand. A brand manager sees only the brands ticked for them. Everyone signs in at this same link with a code sent to their email, and stays signed in for 30 days on each device. Removing someone here signs them out everywhere.</p>' +
    tbl(['Email','Brands',''], list.map(r => [esc(r.email), esc(String(r.brands).split(',').map(x => brandName(x.trim())).join(', ')), '<button class="btn" data-email="' + esc(r.email) + '" onclick="delAdmin(this.dataset.email)">Remove</button>'])) +
    '<div style="margin-top:14px"><b>Add or update a person</b></div>' +
    '<div class="row" style="margin-top:8px"><input type="text" id="aEmail" placeholder="email (or paste Name &lt;email&gt;)" style="min-width:320px"></div>' +
    '<div class="chips" id="aBrands">' + S.home.brands.map(b => '<label class="chip"><input type="checkbox" value="' + b.key + '"' + (b.key === S.brand.key ? ' checked' : '') + '> ' + esc(b.name) + '</label>').join('') + '</div>' +
    '<button class="btn primary" onclick="addAdmin()">Give access</button></div>';
}
async function addAdmin() {
  const brands = Array.from(document.querySelectorAll('#aBrands input:checked')).map(i => i.value).join(',');
  await call('apiSaveAdmin', $('aEmail').value, brands, false); toast('Access saved. They can open the same dashboard link.'); renderAccess();
}
async function delAdmin(e) { if (!confirm('Remove ' + e + '?')) return; await call('apiSaveAdmin', e, '', true); renderAccess(); }

goHome();
</script>
